name: Deploy su GitHub Pages

on:
  push:
    branches: [main, sito-nuovo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Per ora: avviso "il nuovo sito è in arrivo" in radice, sito completo in /anteprima/ (noindex).
      # Al go-live togliere COMING_SOON: il sito torna in radice, indicizzabile, con sitemap.xml.
      - name: Genera il sito (IT, EN, DE)
        run: node build.mjs
        env:
          SITE: https://garnidellalocanda.it
          COMING_SOON: "1"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

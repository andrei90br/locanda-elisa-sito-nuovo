name: Deploy su GitHub Pages

on:
  push:
    branches: [main, sito-nuovo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Genera il sito (IT, EN, DE)
        shell: powershell
        run: |
          # Sito pubblico sul dominio definitivo: indicizzabile, con CNAME, robots.txt e sitemap.xml.
          ./build.ps1 -Site "https://garnidellalocanda.it"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

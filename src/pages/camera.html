<section class="hero hero--page" id="top" data-theme="dark">
  <img class="hero__bg" src="{{IMG}}/{{R_IMG1}}" alt="{{R_ALT1}}" fetchpriority="high" decoding="async">
  <div class="hero__shade"></div>
  <div class="hero__c">
    <span class="eyebrow">{{st_e}}</span>
    <h1>{{R_NAME}}</h1>
    <p class="hero__sub">{{R_SUB}}</p>
    <div class="hero__cta">
      <button class="btn-f" data-open="req" data-room="{{R_N}}" data-cta="room_hero">{{book_avail}}</button>
      <a class="lnk lnk--w" href="{{u_booking}}" target="_blank" rel="noopener" data-cta="room_booking">{{book_online}}<span class="sr"> ({{newtab}})</span></a>
    </div>
  </div>
</section>

<section class="proof" data-theme="light" aria-label="{{R_NAME}}">
  <div><b>{{R_F1N}}</b><span>{{R_F1T}}</span></div>
  <div><b>{{R_F2N}}</b><span>{{R_F2T}}</span></div>
  <div><b>{{R_F3N}}</b><span>{{R_F3T}}</span></div>
  <div><b>{{R_F4N}}</b><span>{{R_F4T}}</span></div>
</section>

<section class="txt" data-theme="light">
  <div class="txt__l"><span class="eyebrow eyebrow--dk">{{room_e}}</span><h2>{{R_H}}</h2></div>
  <div class="txt__r"><p>{{R_P1}}</p><p>{{R_P2}}</p>
    <ul class="ticks"><li>{{room_t1}}</li><li>{{room_t2}}</li><li>{{room_t3}}</li><li>{{room_t4}}</li></ul></div>
</section>

<section class="gal" data-theme="light" aria-label="{{gal_lbl}}: {{R_NAME}}">
  <img src="{{IMG}}/{{R_IMG2}}" alt="{{R_ALT2}}" loading="lazy" decoding="async">
  <img src="{{IMG}}/{{R_IMG3}}" alt="{{R_ALT3}}" loading="lazy" decoding="async">
  <img src="{{IMG}}/{{R_IMG4}}" alt="{{R_ALT4}}" loading="lazy" decoding="async">
</section>

<section class="more" data-theme="light">
  <span class="eyebrow eyebrow--dk">{{room_other}}</span>
  <a class="more__l" href="{{HOME}}camere/{{R_OTHER_SLUG}}/">{{R_OTHER_NAME}}</a>
  <a class="lnk" href="{{HOME}}camere/">{{room_all}}</a>
</section>
{{FIN}}

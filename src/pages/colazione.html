<section class="hero hero--page" id="top" data-theme="dark">

  <div class="hero__shade"></div>
  <div class="hero__c">
    <span class="eyebrow">{{col_e}}</span>
    <h1>{{col_h1}}</h1>
    <p class="hero__sub">{{col_sub}}</p>
    <div class="hero__cta"><button class="btn-f" data-open="req" data-cta="breakfast_hero">{{hero_cta}}</button></div>
  </div>
</section>

  <div class="txt__r"><p>{{col_p1}}</p><p>{{col_p2}}</p></div>
</section>

<section class="grid4 grid4--2 grid4--tall" data-theme="light">
  <article><img src="{{ROOT}}assets/img/sala-colazione.webp" alt="{{sc5_alt}}" loading="lazy" decoding="async"><h4>{{sc5_h}}</h4><p>{{sc5_p}}</p></article>
  <article><img src="{{ROOT}}assets/img/colazione-croissant.webp" alt="{{sc6_alt}}" loading="lazy" decoding="async"><h4>{{sc6_h}}</h4><p>{{sc6_p}}</p></article>

<section class="hero hero--page" id="top" data-theme="dark">
  <img class="hero__bg" src="{{ROOT}}assets/img/ingresso-bottega-moderna.webp" alt="{{pn3_alt}}" style="object-position:50% 40%" fetchpriority="high" decoding="async">
  <div class="hero__shade"></div>
  <div class="hero__c">
    <span class="eyebrow">{{bar_e}}</span>
    <h1>{{bar_h1}}</h1>
    <p class="hero__sub">{{bar_sub}}</p>
    <div class="hero__cta"><a class="btn-f" href="{{MAPS}}" target="_blank" rel="noopener" data-cta="bar_maps">{{vds_maps}}<span class="sr"> ({{newtab}})</span></a></div>
  </div>
</section>

<section class="proof" data-theme="light" aria-label="{{bar_hours}}">
  <div><b>9:30–13:30</b><span>{{bar_am}}</span></div>
  <div><b>17:00–22:00</b><span>{{bar_pm}}</span></div>
  <div><b>{{bar_open_n}}</b><span>{{bar_open_t}}</span></div>
  <div><b>{{vds1_n}}</b><span>{{vds1_t}}</span></div>
</section>

<section class="txt" data-theme="light">
  <div class="txt__l"><span class="eyebrow eyebrow--dk">{{bar_e}}</span><h2>{{bar_h}}</h2></div>
  <div class="txt__r"><p>{{bar_p1}}</p><p>{{bar_p2}}</p>
    <ul class="ticks"><li>{{bar_t1}}</li><li>{{bar_t2}}</li></ul></div>
</section>

<section class="grid4 grid4--2 grid4--tall" data-theme="light">
  <article><img src="{{ROOT}}assets/img/ingresso-bottega-moderna.webp" alt="{{pn3_alt}}" loading="lazy" decoding="async"></article>
  <article><img src="{{ROOT}}assets/img/colazione-croissant.webp" alt="{{sc6_alt}}" loading="lazy" decoding="async"></article>
</section>
{{FIN}}
